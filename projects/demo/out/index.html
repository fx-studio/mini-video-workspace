<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>frame</title>
<style>
  /* Font có sẵn trên máy, đủ dấu tiếng Việt. Không tải gì từ mạng. */
  html, body {
    margin: 0; padding: 0;
    width: 1080px; height: 1920px; overflow: hidden;
    background: #0d1117;
    font-family: "Avenir Next", "Helvetica Neue", Arial, "Segoe UI", "Noto Sans", "DejaVu Sans", sans-serif;
    color: #f5f7fa;
  }
  /* KHÔNG có transition / animation: mọi chuyển động do seek(t) tính. */
  * { transition: none !important; animation: none !important; }
  #bg {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 40%, #1d2a44 0%, #0d1117 65%);
  }
  #progress-track {
    position: absolute; left: 60px; right: 60px; top: 250px; height: 8px;
    background: rgba(255,255,255,0.12); border-radius: 4px;
  }
  #progress {
    height: 100%; width: 0; background: #ffb547; border-radius: 4px;
  }
  #title {
    position: absolute; left: 60px; right: 60px; top: 290px;
    font-size: 34px; font-weight: 600; letter-spacing: 2px;
    color: rgba(255,255,255,0.55); text-transform: uppercase;
  }
  /* Vùng an toàn chữ: y 250–1450 */
  #stage {
    position: absolute; left: 70px; right: 70px; top: 380px; height: 1070px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  #show {
    font-size: 116px; line-height: 1.12; font-weight: 800;
    color: #ffffff; transform-origin: 50% 50%;
    max-width: 940px; word-wrap: break-word;
  }
  #accent {
    width: 160px; height: 10px; background: #ffb547; border-radius: 5px;
    margin: 48px auto 48px auto; transform-origin: 50% 50%;
  }
  #sub-now {
    font-size: 46px; line-height: 1.32; font-weight: 600; color: #ffffff;
    max-width: 920px;
  }
  #sub-next {
    margin-top: 26px;
    font-size: 38px; line-height: 1.3; font-weight: 500; color: rgba(255,255,255,0.32);
    max-width: 920px;
  }
</style>
</head>
<body>
<div id="bg"></div>
<div id="progress-track"><div id="progress"></div></div>
<div id="title"></div>
<div id="stage">
  <div id="show"></div>
  <div id="accent"></div>
  <div id="sub-now"></div>
  <div id="sub-next"></div>
</div>
<script>
window.MANIFEST = {"total_ms": 16268, "segments": [{"id": "s1", "start_ms": 0, "end_ms": 5976, "say": "Đây là xưởng làm video dọc mini: bạn viết kịch bản, chạy một lệnh là có video.", "show": "MỘT LỆNH"}, {"id": "s2", "start_ms": 6226, "end_ms": 10810, "say": "Giọng đọc sinh bằng edge-tts, mốc thời gian đo trên từng file thật.", "show": "GIỌNG THẬT"}, {"id": "s3", "start_ms": 11060, "end_ms": 16268, "say": "Hình vẽ bằng HTML, chụp từng khung rồi ghép thành mp4 có tiếng.", "show": "RA MP4"}]};
window.TITLE = "Xưởng video mini";
// make.py thay dòng trên bằng: window.MANIFEST = {...}; window.TITLE = "...";
(function () {
  var M = window.MANIFEST || { total_ms: 1000, segments: [] };
  var segs = M.segments;
  var el = {
    progress: document.getElementById("progress"),
    title: document.getElementById("title"),
    show: document.getElementById("show"),
    accent: document.getElementById("accent"),
    now: document.getElementById("sub-now"),
    next: document.getElementById("sub-next")
  };
  el.title.textContent = window.TITLE || "";

  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function easeOutBack(x) { var c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }

  // Cảnh i kéo dài từ start_ms của nó tới start_ms của cảnh sau (gồm cả khoảng lặng).
  function sceneAt(ms) {
    var idx = 0;
    for (var i = 0; i < segs.length; i++) { if (ms >= segs[i].start_ms) idx = i; }
    return idx;
  }

  // Hàm thuần của t (giây). Không đọc đồng hồ, không ngẫu nhiên, không trạng thái ẩn.
  window.seek = function (t) {
    var ms = t * 1000;
    el.progress.style.width = (clamp(ms / M.total_ms, 0, 1) * 100).toFixed(4) + "%";
    if (!segs.length) return;
    var i = sceneAt(ms);
    var s = segs[i];
    var local = (ms - s.start_ms) / 1000;           // giây kể từ đầu cảnh
    var p = clamp(local / 0.3, 0, 1);               // đập vào trong 0,3 s
    var scale = 1.8 - 0.8 * easeOutBack(p);
    el.show.textContent = s.show;
    el.show.style.opacity = p.toFixed(4);
    el.show.style.transform = "scale(" + scale.toFixed(4) + ")";
    el.accent.style.transform = "scaleX(" + p.toFixed(4) + ")";
    el.now.textContent = s.say;
    el.now.style.opacity = clamp(local / 0.2, 0, 1).toFixed(4);
    el.next.textContent = (i + 1 < segs.length) ? segs[i + 1].say : "";
  };
  window.seek(0);
})();
</script>
</body>
</html>
